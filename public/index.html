<title>Supermarkt Tycoon</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supermarkt"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#cfe3a0">
<style>
:root{--ink:#1d2742;--paper:#f7efd6;--paper2:#fffdf2;--yel:#f2b705;--red:#e0303c;--teal:#6fb8c2;--grn:#3fb04a;--blu:#3a7ae0;--pur:#7a4ad0;--f-display:"Caveat Brush",cursive;--f-body:"Patrick Hand",system-ui,sans-serif;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3a0;font-family:var(--f-body);color:var(--ink);font-size:16px;overscroll-behavior:none}
#world{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:#cfe3a0;touch-action:pan-x pan-y}
#world::-webkit-scrollbar{display:none}
#sc{display:block}
#staff,#dyn,#pop,#fore{pointer-events:none}
.tp{pointer-events:all;cursor:pointer}
.cb{animation:none}
.cell{cursor:pointer}
.tw{animation:tw 2.4s infinite alternate}@keyframes tw{to{opacity:.15}}
.cl{animation:cl linear infinite}@keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
.sun{transform-origin:150px 74px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:bl 2.6s infinite}@keyframes bl{0%,88%{opacity:1}94%{opacity:.75}}
.tv{animation:tv 2.2s infinite steps(2)}@keyframes tv{50%{opacity:.55}}
.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fire .5s infinite alternate}@keyframes fire{to{transform:scale(1.08,1.18)}}
.smoke{animation:smk 3s infinite}@keyframes smk{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.tapme>g{animation:tm .7s infinite alternate}@keyframes tm{to{transform:translateY(-4px)}}
.rotor{transform-box:fill-box;transform-origin:50% 50%;animation:rt .25s linear infinite}@keyframes rt{to{transform:scaleX(-1)}}
.beam{animation:bm 8s ease-in-out infinite alternate}.beam2{animation:bm 11s ease-in-out infinite alternate-reverse}@keyframes bm{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.drip{animation:smk 2s infinite}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{display:inline-block;vertical-align:middle;flex:none}
#hud{position:fixed;left:0;right:0;top:0;z-index:40;padding:calc(var(--safe-t) + 8px) 8px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pill{background:rgba(29,39,66,.92);color:#fff;border-radius:16px;border:2.5px solid var(--ink);padding:3px 10px 3px 6px;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:19px;line-height:1.1;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:auto}
.pill.sm{font-size:18px}
.pill small{display:block;font-size:15px;color:#6af07a;font-family:var(--f-display)}
.pill .col{display:flex;flex-direction:column}
.pill.gem{margin-left:auto;padding-right:2px}
.plus{width:30px;height:30px;border-radius:50%;background:#3fb04a;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-display);font-size:24px;line-height:1;margin-left:4px}
#quest{position:fixed;left:8px;right:8px;top:calc(var(--safe-t) + 66px);z-index:30;background:#3a7ae0;border:3px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:auto}
#quest .bar{height:14px;background:#1d3a8a;border-radius:8px;border:2px solid var(--ink);position:relative;overflow:hidden;margin-right:40px}
#quest .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3a9aff,#6ac8ff);border-radius:6px}
#quest .chest{position:absolute;right:4px;top:-4px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#quest .chest.rdy{animation:bob .6s infinite alternate}
#quest .qs{display:flex;gap:5px;margin-top:5px}
#quest .q{flex:1;background:#fffdf2;border-radius:10px;border:2px solid var(--ink);padding:3px 5px;font-size:12px;line-height:1.1;min-height:60px;display:flex;flex-direction:column;justify-content:space-between}
.pg{height:15px;background:#1d3a8a;border-radius:8px;position:relative;overflow:hidden;border:2px solid var(--ink)}
.pg i{position:absolute;left:0;top:0;bottom:0;background:#4a9aff}
.pg b{position:absolute;inset:0;text-align:center;color:#fff;font-family:var(--f-display);font-size:12px;line-height:11px}
@keyframes bob{to{transform:translateY(-4px)}}
.side{position:fixed;z-index:25;display:flex;flex-direction:column;gap:8px}
#sl{left:8px;top:calc(var(--safe-t) + 160px)}
#sr{right:8px;top:calc(var(--safe-t) + 160px)}
#sr2{right:8px;bottom:calc(var(--safe-b) + 90px);gap:10px}
.ib{width:54px;height:54px;background:#fffdf2;border:3px solid var(--ink);border-radius:15px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.ib:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

function resValueOf(r, L) {
  switch (r.type) {
    case "dept": return L <= 0 ? 1 : 1.5 * Math.pow(1.15, L - 1);
    case "cash": return 1 + 0.30 * L;
    case "proc": return 1 + 0.25 * L;
    case "cust": return 1 + 0.30 * L;
    case "multi": return 0.05 * L;
    case "offline": return L;        // Stunden
    case "ad": return 1 + 0.20 * L;
  }
  return 1;
}
function resText(r, L) {
  const f = v => "x" + trimNum(v, 2);
  switch (r.type) {
    case "dept": return f(resValueOf(r, L)) + " » " + f(resValueOf(r, L + 1));
    case "cash": case "proc": case "cust": case "ad": return f(resValueOf(r, L)) + " » " + f(resValueOf(r, L + 1));
    case "multi": return Math.round(resValueOf(r, L) * 100) + "% » " + Math.round(resValueOf(r, L + 1) * 100) + "%";
    case "offline": return L + "h » +" + (L + 1) + "h";
  }
  return "";
}

// ---------- Rechenformeln ----------
const msCount = l => { let n = 0; for (const m of MILESTONES) if (l >= m) n++; return n; };
const deptPrice = (id, l) => DEPT_BY[id].p0 * l * Math.pow(2, msCount(l));
const lvlCost = (id, l) => DEPT_BY[id].c0 * Math.pow(LVL_GROWTH, l - 1);
const geo = (c0, r, n) => c0 * (Math.pow(r, n) - 1) / (r - 1);
function maxAfford(c0, r, money, cap) {
  if (money < c0) return 0;
  const n = Math.floor(Math.log(1 + money * (r - 1) / c0) / Math.log(r));
  return clamp(n, 0, cap);
}
const locOf = () => LOCS[S.loc];
const lvlCap = () => locOf().maxLvl;
function nextMilestone(l) { for (const m of MILESTONES) if (m > l && m <= lvlCap()) return m; return lvlCap(); }
function buyCount(id) { // wie viele Stufen würde ein Klick kaufen
  const d = S.dept[id], cap = Math.max(0, lvlCap() - d.lvl);
  if (S.mode === 0) return Math.max(1, Math.min(cap, maxAfford(lvlCost(id, d.lvl), LVL_GROWTH, S.money, cap)));
  return Math.min(S.mode, cap);
}
function levelCostN(id, n) { return geo(lvlCost(id, S.dept[id].lvl), LVL_GROWTH, n); }
function levelUp(id) {
  const d = S.dept[id], n = buyCount(id);
  if (n <= 0) return false;
  const c = levelCostN(id, n);
  if (S.money < c) return false;
  S.money -= c; d.lvl += n; recalc(); return true;
}
function skipMilestone(id) {
  const d = S.dept[id], t = nextMilestone(d.lvl), n = t - d.lvl;
  if (n <= 0) return false;
  const g = Math.ceil(n * 0.7);
  if (S.gems < g) return false;
  S.gems -= g; d.lvl = t; recalc(); return true;
}
const hireCost = id => DEPT_BY[id].c0 * 40 * Math.pow(8, S.dept[id].emp - 1);
const procCost = id => DEPT_BY[id].c0 * 40 * Math.pow(PROC_GROWTH, S.dept[id].proc);
function hire(id) { const d = S.dept[id]; if (d.emp >= 4) return false; const c = hireCost(id); if (S.money < c) return false; S.money -= c; d.emp++; recalc(); return true; }
function procUp(id) { const d = S.dept[id]; if (d.proc >= 60) return false; const c = procCost(id); if (S.money < c) return false; S.money -= c; d.proc++; recalc(); return true; }

// Manager
const mgrLvl = id => (S.mgr[id] ? S.mgr[id].lvl : 0);
const mgrMult = id => MGR_MULT[mgrLvl(id)] || 1;
const isAuto = id => mgrLvl(id) >= 2;
const cardsNeed = lvl => Math.pow(2, lvl);
const mgrRpCost = lvl => 25 * Math.pow(2, lvl - 1);
function addCards(grp, id, n) {
  if (grp === "lab") { S.lab.mcards[id] += n; if (!S.lab.mlv[id] && S.lab.mcards[id] >= 1) { S.lab.mlv[id] = 1; S.lab.mcards[id]--; } return; }
  if (grp === "ord") { S.ord.mcards[id] += n; if (!S.ord.mlv[id] && S.ord.mcards[id] >= 1) { S.ord.mlv[id] = 1; S.ord.mcards[id]--; } return; }
  const m = S.mgr[id]; m.cards += n;
  if (m.lvl === 0 && m.cards >= 1) { m.lvl = 1; m.cards--; }
}
function canUpMgr(id) { const m = S.mgr[id]; return m.lvl >= 1 && m.lvl < MGR_MAX && m.cards >= cardsNeed(m.lvl) && S.rp >= mgrRpCost(m.lvl); }
function upMgr(id) { const m = S.mgr[id]; if (!canUpMgr(id)) return false; m.cards -= cardsNeed(m.lvl); S.rp -= mgrRpCost(m.lvl); m.lvl++; recalc(); return true; }
function subLvl(grp, id) { return grp === "lab" ? S.lab.mlv[id] : S.ord.mlv[id]; }
function subCards(grp, id) { return grp === "lab" ? S.lab.mcards[id] : S.ord.mcards[id]; }
function upSub(grp, id) {
  const lv = subLvl(grp, id), need = cardsNeed(lv), rp = mgrRpCost(lv);
  if (lv < 1 || lv >= 8 || subCards(grp, id) < need || S.rp < rp) return false;
  if (grp === "lab") { S.lab.mcards[id] -= need; S.lab.mlv[id]++; } else { S.ord.mcards[id] -= need; S.ord.mlv[id]++; }
  S.rp -= rp; return true;
}
const engLvl = eff => { const m = MGRS.find(x => x.eff === eff); return m ? mgrLvl(m.id) : 0; };
const labBonus = eff => { let v = 0; LAB_MGRS.forEach(m => { if (m.eff === eff) v += m.per * (S.lab.mlv[m.id] || 0); }); return v; };
const ordBonus = eff => { let v = 0; ORD_MGRS.forEach(m => { if (m.eff === eff) v += m.per * (S.ord.mlv[m.id] || 0); }); return v; };

// Forschung
const resLv = id => S.res.lv[id] || 0;
const resVal = id => resValueOf(RES_BY[id], resLv(id));
function resAvailable() { return RES.filter(r => !r.dept || S.dept[r.dept]); }
const resCost = id => Math.ceil(RES_BY[id].rp * Math.pow(1.3, resLv(id)) * (1 - Math.min(0.5, labBonus("cost"))));
function resTime(id) {
  const r = RES_BY[id], L = resLv(id);
  let t = r.min * 60 * (1 + 0.5 * L);
  t *= Math.max(0.2, 1 - labBonus("time") - 0.10 * (S.ult.u_lab || 0));
  if (S.res.lab2x) t *= 0.5;
  return Math.ceil(t);
}
function startRes(id, slot) {
  if (S.res.slots[slot] || slot >= S.res.unl) return false;
  if (S.res.slots.some(x => x && x.id === id)) return false;
  const c = resCost(id); if (S.rp < c) return false;
  S.rp -= c; const t = resTime(id);
  S.res.slots[slot] = { id, start: nowMs(), end: nowMs() + t * 1000 };
  return true;
}
function resGemSkip(slot) { const x = S.res.slots[slot]; return x ? Math.max(1, Math.ceil((x.end - nowMs()) / 60000)) : 0; }
function finishRes(slot, instantGems) {
  const x = S.res.slots[slot]; if (!x) return false;
  if (instantGems) { const g = resGemSkip(slot); if (S.gems < g) return false; S.gems -= g; x.end = nowMs(); }
  if (nowMs() < x.end) return false;
  S.res.lv[x.id] = resLv(x.id) + 1; S.res.slots[slot] = null; recalc(); return true;
}
const LAB_UNLOCK = [0, 100, 300, 600];
function unlockLab() { const c = LAB_UNLOCK[S.res.unl]; if (c === undefined || S.res.unl >= 4 || S.gems < c) return false; S.gems -= c; S.res.unl++; return true; }

// ---------- Berechnung ----------
function globalMult() {
  let m = locOf().mult;
  if (S.perm.seal) m *= 2;
  m *= 1 + 0.20 * (S.ult.u_profit || 0);
  m *= 1 + 0.15 * engLvl("profit");
  if (nowMs() < S.boost.until) m *= 2 * resVal("p_werb");
  return m;
}
function calc(offline) {
  const loc = locOf();
  const spots = Math.round(6 * S.park.lvl * (1 + 0.10 * engLvl("park")));
  const arrival = 2 * S.park.ad * resVal("p_kunde") * (1 + 0.10 * engLvl("ad")) * (1 + 0.15 * (S.ult.u_cust || 0));
  const maxFlow = spots * 60 / CAR_DWELL;
  const C0 = Math.min(arrival, maxFlow) * (1 + resVal("p_multi"));
  const cashCap = S.kasse.n * 12 * resVal("p_kasse") * (1 + 0.25 * engLvl("cash"));
  const flow = Math.min(C0, cashCap);
  const gm = globalMult();
  const depts = {}; let income = 0, perCust = 0;
  for (const id in S.dept) {
    const d = S.dept[id], def = DEPT_BY[id];
    const price = deptPrice(id, d.lvl) * mgrMult(id) * resVal("r_" + id) * gm;
    const T = def.T * Math.pow(0.975, d.proc) / resVal("p_stock");
    const cap = d.emp * 60 / T;
    const active = isAuto(id) || (!offline && nowMs() < d.act);
    const sold = active ? Math.min(flow, cap) : 0;
    const inc = sold * price;
    depts[id] = { price, T, cap, active, sold, inc };
    income += inc; perCust += price;
  }
  C = { spots, arrival, maxFlow, C0, cashCap, flow, income, perCust, depts, gm,
    parkUse: Math.min(1, arrival * CAR_DWELL / 60 / Math.max(1, spots)),
    queue: Math.max(0, Math.round((C0 - cashCap) / 6)),
    wait: Math.max(2, 60 / Math.max(1, cashCap) * (C0 > cashCap ? 2 : 0.6)) };
  return C;
}
function recalc() { calc(false); }

// ---------- Tick ----------
function tick(dt) {
  calc(false);
  const earn = C.income / 60 * dt;
  S.money += earn; S.st.earned += earn; S.st.played += dt;
  for (const id in C.depts) S.st.served[id] += C.depts[id].sold / 60 * dt;
  // Vorrat füllt sich
  const o = S.ord, maxS = stockMax();
  o.acc += dt;
  const per = 56 * (1 - Math.min(0.6, ordBonus("speed")));
  while (o.acc >= per) { o.acc -= per; o.stock = Math.min(maxS, o.stock + 2 + ordBonus("stock")); }
  if (o.stock > maxS) o.stock = maxS;
  // Forschung fertig?
  S.res.slots.forEach((x, i) => { if (x && nowMs() >= x.end) finishRes(i, false); });
  // Gratis-Pakete laden nach
  if (S.packs.free < 5 && nowMs() >= S.packs.next) { S.packs.free++; S.packs.next = S.packs.free < 5 ? nowMs() + 30 * 60000 : 0; }
  questTick();
}
const stockMax = () => locOf().stock;

// ---------- Offline ----------
function offlineCapSec() {
  let h = 2 + resVal("p_offline") + (S.ult.u_off || 0) + engLvl("offline");
  if (S.perm.ceo) h += 10;
  return h * 3600;
}
function applyOffline() {
  const el = Math.max(0, (nowMs() - S.last) / 1000);
  if (el < 30) return null;
  const sec = Math.min(el, offlineCapSec());
  const c = calc(true);
  const earn = c.income * sec / 60;
  S.money += earn; S.st.earned += earn;
  S.ord.stock = Math.min(stockMax(), S.ord.stock + Math.floor(sec / 56) * (2 + ordBonus("stock")));
  return { sec, earn, away: el };
}

// ---------- Bestellungen ----------
function genOrders() {
  const o = S.ord;

}
"use strict";
// Steuerung: Eingaben, Seiten, Spielschleife
const PAGES = { verw: pageVerw, park: pagePark, map: pageMap, cards: pageCards, lab: pageLab, resel: pageResel, orders: pageOrders, shop: pageShop, pass: pagePass, set: pageSet };
const lastHtml = { chrome: "", layer: "" };

function openPage(name, arg) {
  UI.page = name; UI.dept = null; focusDept(null);
  if (arg) UI.tab[name] = arg;
  renderAll(true);
}
function closeTop() {
  if (UI.modal) { closeModal(); return; }
  if (UI.page === "resel") UI.page = "lab"; else if (UI.page) UI.page = null; else if (UI.dept) { UI.dept = null; focusDept(null); }
  renderAll(true);
}
function openDept(id) {
  if (!S.dept[id]) return;
  UI.page = null; UI.dept = id; S.dept[id].act = nowMs() + 30000; calc(false); focusDept(id); renderAll(true);
}
function renderLayer(force) {
  const L = $id("layer");
  let html = ""; if (UI.page && PAGES[UI.page]) html += PAGES[UI.page](); if (UI.dept) html += deptSheet();
  if (!force && html === lastHtml.layer) return;
  const keep = {}; L.querySelectorAll("[data-sc],.sheet .in").forEach(e => { keep[e.dataset.sc || "sheet"] = e.scrollTop; });
  L.innerHTML = html; lastHtml.layer = html;
  L.querySelectorAll("[data-sc],.sheet .in").forEach(e => { const k = e.dataset.sc || "sheet"; if (keep[k]) e.scrollTop = keep[k]; });
}
function renderAll(force) {
  renderChrome(); renderLayer(force);
}

function done(ok, snd, err) {
  if (ok) { sfx(snd || "buy"); } else { sfx("err"); if (err) toast(err); }
  renderAll(true); return ok;
}
function act(a) {
  const p = a.split(":"), k = p[0];
  switch (k) {
    case "noop": return;
    case "mclose": closeModal(); return;
    case "close": closeTop(); sfx("tap"); return;
    case "open": sfx("tap"); openPage(p[1], p[2]); return;
    case "tab": sfx("tap"); UI.tab[p[1]] = p[2]; renderAll(true); return;
    case "dept": sfx("tap"); openDept(p[1]); return;
    case "lv": return done(levelUp(p[1]), "up", "Nicht genug Geld");
    case "hire": return done(hire(p[1]), "buy", "Nicht genug Geld");
    case "proc": return done(procUp(p[1]), "buy", "Nicht genug Geld");
    case "skip": return done(skipMilestone(p[1]), "up", "Nicht genug Edelsteine");
    case "mode": S.mode = +p[1]; sfx("tap"); renderAll(true); return;
    case "mup": return done(upMgr(p[1]), "up", "Dir fehlen Karten oder Forschungspunkte");
    case "park": return done(buyPark(), "buy", "Nicht genug Geld");
    case "ad": return done(buyAd(), "buy", "Nicht genug Geld");
    case "kasse": return done(buyKasse(), "buy", "Nicht genug Geld");
    case "loc": { const ok = buyLoc(); if (ok) { sfx("up"); toast("Neuer Standort: " + locOf().name); resetScene(); } return done(ok, "up", "Nicht genug Geld"); }
    case "chest": { const r = openChest(); if (!r) { sfx("err"); toast("Schließe 5 Quests ab für die Truhe"); return; } sfx("pack"); packModal(r.cards, "Quest-Truhe: +" + r.r.gems + " 💎 +" + r.r.rp + " FP" + (r.r.gold ? " +1 Gold" : "")); renderAll(true); return; }
    case "coin": { const v = collectCoin(+p[1]); if (v) { sfx("coin"); } return; }
    case "vip": { const r = collectVip(); if (r) { sfx("claim"); toast("VIP-Kunde: +" + fmt(r.v) + " Geld" + (r.g ? " und 1 Edelstein" : "")); } return; }
    case "adboost": adBoost(); sfx("claim"); toast("Werbe-Boost aktiv (Test)"); renderAll(true); return;
    case "mcard": modal(mcardModal(p[1])); sfx("tap"); return;
    case "resel": UI.resSlot = +p[1]; UI.page = "resel"; sfx("tap"); renderAll(true); return;
    case "rstart": { const ok = startRes(p[1], UI.resSlot); if (ok) { UI.page = "lab"; } return done(ok, "buy", "Forschung nicht möglich (Forschungspunkte?)"); }
    case "rskip": return done(finishRes(+p[1], true), "claim", "Nicht genug Edelsteine");
    case "labunl": return done(unlockLab(), "up", "Nicht genug Edelsteine");
    case "ult": return done(buyUlt(p[1]), "up", "Nicht genug Goldbarren");
    case "subup": { if (upSub(p[1], p[2])) { sfx("up"); renderAll(true); } else { sfx("tap"); toast("Dir fehlen Karten oder Forschungspunkte"); } return; }
    case "ostart": return done(startOrder(+p[1]), "buy", "Nicht genug Vorrat");
    case "oskip": { const r = claimOrder(+p[1], true); if (r) { sfx("claim"); toast("+" + fmt(r.cash) + " Geld, +" + r.rp + " FP"); renderAll(true); } else done(false, 0, "Nicht genug Edelsteine"); return; }
    case "oclaim": { const r = claimOrder(+p[1], false); if (r) { sfx("claim"); toast("+" + fmt(r.cash) + " Geld, +" + r.rp + " FP"); renderAll(true); } return; }
    case "pack": { const r = openPack(p[1], false); if (!r) { sfx("err"); toast("Nicht genug Edelsteine"); return; } sfx("pack"); packModal(r); renderAll(true); return; }
    case "freepack": { const r = freePack(); if (!r) { sfx("err"); toast("Gerade kein Gratis-Paket (lädt nach)"); return; } sfx("pack"); packModal(r); renderAll(true); return; }
    case "rppack": return done(buyRp(+p[1]), "claim", "Nicht genug Edelsteine");
    case "tboost": { const r = buyTimeBoost(+p[1]); if (r) toast("+" + fmt(r) + " Geld"); return done(!!r, "coin", "Nicht genug Edelsteine"); }
    case "eur": { const kind = p[1], id = p[2]; const ok = euroBuy(kind, id); if (ok) toast("Testmodus: Kauf gewährt"); return done(ok, "claim", "Testmodus ist aus"); }
    case "daily": { const r = claimDaily(); if (r) { sfx("claim"); toast("Tag " + r.day + ": +" + r.gems + " Edelsteine"); } renderAll(true); return; }
    case "pclaim": { const r = passClaim(p[1], +p[2]); if (!r) { sfx("tap"); return; } sfx("claim"); if (r.cards) packModal(r.cards); renderAll(true); return; }
    case "set": S.set[p[1]] = !S.set[p[1]]; if (p[1] === "music") auMusic(); sfx("tap"); renderAll(true); return;
    case "export": { saveGame(); const s = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); try { navigator.clipboard.writeText(s); toast("Spielstand kopiert"); } catch (e) { prompt("Spielstand:", s); } return; }
    case "import": { const s = prompt("Spielstand einfügen:"); if (!s) return; try { const o = JSON.parse(decodeURIComponent(escape(atob(s.trim())))); localStorage.setItem(SAVE_KEY, JSON.stringify(o)); location.reload(); } catch (e) { toast("Ungültiger Spielstand"); } return; }
    case "reset": modal("<h2>Neu anfangen?</h2><div class='muted'>Dein gesamter Fortschritt wird gelöscht.</div><div class='row' style='margin-top:12px'><button class='btn white sp' data-a='mclose'>Abbrechen</button><button class='btn red sp' data-a='reset2'>Löschen</button></div>"); return;
    case "reset2": resetGame(); closeModal(); UI.page = null; UI.dept = null; focusDept(null); renderAll(true); return;
  }
}

// ---------- Eingaben ----------
document.addEventListener("pointerdown", e => {
  auInit();
  const t = e.target.closest && e.target.closest("[data-a]");
  UI.down = { a: t ? t.dataset.a : null, x: e.clientX, y: e.clientY }; UI.busy = true;
}, true);
document.addEventListener("pointerup", e => {
  UI.busy = false; const d = UI.down; UI.down = null; if (!d) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14) return;
  if (!d.a) return;
  const t = document.elementFromPoint(e.clientX, e.clientY), el = t && t.closest("[data-a]");
  if (!el || el.dataset.a !== d.a) return;
  act(d.a);
}, true);
document.addEventListener("pointercancel", () => { UI.busy = false; UI.down = null; }, true);
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- Start und Schleife ----------
let lastT = 0, accUI = 0, accSave = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000 || 0.016); lastT = ts;
  tick(dt);
  drawFrame(dt);
  accUI += dt; accSave += dt;
  if (questFlash) { toast(questFlash); sfx("quest"); questFlash = null; }
  if (accUI > 0.25 && !UI.busy) { accUI = 0; renderChrome(); renderLayer(false); }
  if (accSave > 5) { accSave = 0; saveGame(); }
  requestAnimationFrame(frame);
}
function onReturn() {
  if (!S) return;
  const o = applyOffline(); if (o) { S.last = nowMs(); welcomeModal(o); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); else onReturn(); });
addEventListener("pagehide", saveGame);

function startGame() {
  const loaded = loadGame(); if (!loaded) newState();
  calc(false);
  initRender($id("world"));
  const o = loaded ? applyOffline() : null;
  renderAll(true);
  if (o) welcomeModal(o);
  else if (!S.seen.intro) { S.seen.intro = true; modal("<h2>Willkommen!</h2><div class='muted' style='font-size:16px'>Tippe auf eine Abteilung, um sie zu verbessern. Stelle Mitarbeiter ein, baue den Parkplatz aus und steige vom Kiosk bis zum Weltkonzern auf.<br><br>Im Testmodus gewähren die €- und Werbe-Buttons alles sofort.</div><button class='btn green wide' style='margin-top:12px' data-a='mclose'>Los geht's</button>"); }
  requestAnimationFrame(frame);
}
if (typeof window !== "undefined" && !window.__NOSTART) startGame();
</script>
